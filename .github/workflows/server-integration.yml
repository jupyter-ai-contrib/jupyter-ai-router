name: Server integration

on:
  push:
    branches: main
  pull_request:
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Test matrix (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: no_rtc
            label: default
          - env: rtc_jcollab
            label: "+JCollab"
          - env: rtc_jsd
            label: "+JSD"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install nox + uv
        run: python -m pip install -U nox uv

      - name: Run observer integration tests (${{ matrix.env }})
        # Exercises the init/message/stop observers end-to-end against a real
        # jupyterlab_chat.ChatManager in each transport. See issue #48.
        run: nox -s "integration(env='${{ matrix.env }}')"
